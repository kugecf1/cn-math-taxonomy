name: Sync upstream

on:
  schedule:
    - cron: '0 1 * * *' # Runs at 01:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/xiaoyang111222/cn-math-taxonomy.git
          git fetch upstream
          git checkout main
          # fork 的 main 上有 workflow 文件这一个上游没有的提交，所以上游一更新就不是 fast-forward，必须用普通 merge（产生一个合并提交）；上游从不改 workflow 文件，不会冲突，也不会搞坏仓库。
          git merge upstream/main
          git push origin main
